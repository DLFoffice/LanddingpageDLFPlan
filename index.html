<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" data-keep>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-keep>
<title data-keep>ระบบข้อมูลกลุ่มนโยบายและแผน</title>
<link rel="preconnect" href="https://fonts.googleapis.com" data-keep>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin data-keep>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Anuphan:wght@400;500;600&display=swap" rel="stylesheet" data-keep>
<style data-keep>
:root{
  --bg:#F1F2EE; --surface:#FAFBF8; --ink:#1A2120; --muted:#5F6B66; --faint:#97A09B; --line:#D6DBD4;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --glass-line:rgba(255,255,255,.75);
  --accent-2:color-mix(in oklab,var(--accent) 55%,#6FA8FF);
  --tag-bg:color-mix(in oklab,var(--accent) 16%,#fff); --tag-ink:color-mix(in oklab,var(--accent) 78%,#000);
  --accent:#2D8069; --accent-soft:color-mix(in oklab, var(--accent) 12%, transparent);
  --display:"Anuphan","Bricolage Grotesque","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Anuphan",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121615; --surface:#181D1C; --ink:#E6EBE8; --muted:#98A39E; --faint:#66706B; --line:#2A3230; --glass:rgba(28,34,33,.55); --glass-strong:rgba(32,39,38,.8); --glass-line:rgba(255,255,255,.07); --tag-bg:color-mix(in oklab,var(--accent) 22%,transparent); --tag-ink:var(--accent);
    --accent:color-mix(in oklab, var(--accent-base, #2D8069) 60%, white); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#181D1C; --ink:#E6EBE8; --muted:#98A39E; --faint:#66706B; --line:#2A3230; --glass:rgba(28,34,33,.55); --glass-strong:rgba(32,39,38,.8); --glass-line:rgba(255,255,255,.07); --tag-bg:color-mix(in oklab,var(--accent) 22%,transparent); --tag-ink:var(--accent);
  --accent:color-mix(in oklab, var(--accent-base, #2D8069) 60%, white); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;
  transition:background .5s var(--ease),color .5s var(--ease)}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--accent);color:#fff}

.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,56px)}

/* ---------- Pastel background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--b0);transition:background 1s var(--ease)}
.bg i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.9;transition:background 1.2s var(--ease);will-change:transform}
.bg i:nth-child(1){background:var(--b1);left:-18vmax;top:-22vmax;animation:d1 26s ease-in-out infinite alternate}
.bg i:nth-child(2){background:var(--b2);right:-20vmax;top:-10vmax;animation:d2 32s ease-in-out infinite alternate}
.bg i:nth-child(3){background:var(--b3);left:10vmax;bottom:-30vmax;animation:d3 28s ease-in-out infinite alternate}
.bg i:nth-child(4){background:var(--b4);right:-10vmax;bottom:-26vmax;width:48vmax;height:48vmax;animation:d1 36s ease-in-out infinite alternate-reverse}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,transparent 40%,color-mix(in oklab,var(--b0) 55%,transparent) 100%)}
@keyframes d1{to{transform:translate(12vmax,10vmax) scale(1.12)}}
@keyframes d2{to{transform:translate(-14vmax,12vmax) scale(.9)}}
@keyframes d3{to{transform:translate(8vmax,-12vmax) scale(1.1)}}
:root[data-theme="dark"] .bg{background:var(--bg)}:root[data-theme="dark"] .bg i{opacity:.16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bg{background:var(--bg)}:root:not([data-theme="light"]) .bg i{opacity:.16}}

/* ---------- Top bar ---------- */
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:clamp(18px,3vh,28px) 0;font-size:14px;color:var(--muted)}
.logo{height:48px;width:auto;max-width:200px;object-fit:contain}
.logo-fallback{font:500 15px/1.3 var(--display);color:var(--ink);max-width:280px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* ---------- Hero (centered) ---------- */
.hero{text-align:center;max-width:920px;margin:0 auto;padding:clamp(36px,7vh,72px) 0 clamp(36px,6vh,56px)}
.brand{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:26px}
.brand .logo{height:clamp(96px,12vw,140px);max-width:min(320px,80vw);margin:0 auto;opacity:0;transform:translateY(-10px) scale(.92);
  filter:drop-shadow(0 12px 24px rgba(40,60,55,.12));transition:opacity 1s var(--ease-out),transform 1.2s var(--ease-out)}
.loaded .brand .logo{opacity:1;transform:none}
.brand .logo-fallback{text-align:center}
.org{font-size:clamp(14.5px,1.4vw,17px);color:var(--muted);margin:0 0 12px}
.title{font-family:var(--display);font-weight:500;font-size:clamp(30px,4.4vw,58px);line-height:1.14;letter-spacing:-.02em;margin:0 auto .32em;text-wrap:balance}
.title .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.14em 0 .2em;margin:-.14em 0 -.2em}
.title .w>span{display:inline-block;transform:translateY(112%);transition:transform 1.1s var(--ease-out)}
.loaded .title .w>span{transform:none}
.sub{max-width:34em;margin:0 auto;color:var(--muted);font-size:clamp(16px,1.45vw,19px);font-weight:300;text-wrap:balance}
.fade{opacity:0;transform:translateY(14px);transition:opacity .9s var(--ease-out),transform .9s var(--ease-out)}
.loaded .fade{opacity:1;transform:none}
.finder{position:relative;max-width:560px;margin:34px auto 0}
.finder input{width:100%;font:16px/1.4 var(--body);color:var(--ink);background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:999px;
  padding:16px 56px 16px 52px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 36px -18px rgba(40,60,55,.35);transition:border-color .3s,box-shadow .3s}
.finder input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 12px 36px -18px rgba(40,60,55,.35)}
.finder svg{z-index:1;position:absolute;left:20px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted)}
.finder kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:12px var(--body);color:var(--faint);border:1px solid var(--line);border-radius:7px;padding:2px 8px}


/* ---------- Hero scene: orbit + floating objects ---------- */
html,body{overflow-x:clip}
.hero{position:relative;isolation:isolate}
.scene{position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);pointer-events:none;z-index:-1;overflow:hidden;--px:0;--py:0;--sy:0}
.px{position:absolute;transform:translate3d(calc(var(--px)*var(--d)*1px),calc(var(--py)*var(--d)*1px + var(--sy)*var(--d)*-.04px),0);transition:transform 1.2s var(--ease-out)}
.px>*{opacity:0;transform:scale(.6);transition:opacity 1.2s var(--ease-out),transform 1.4s var(--ease-out);transition-delay:var(--dl,900ms)}
.loaded .px>*{opacity:1;transform:none}
.flt{animation:flt var(--t,9s) ease-in-out infinite alternate}
@keyframes flt{from{translate:0 -10px;rotate:var(--r0,0deg)}to{translate:0 12px;rotate:var(--r1,6deg)}}
.orb{border-radius:50%;background:
  radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,0) 38%),
  radial-gradient(circle at 70% 75%,color-mix(in oklab,var(--accent-2) 55%,transparent),transparent 65%),
  linear-gradient(145deg,color-mix(in oklab,var(--b2,#fde0cc) 90%,white),color-mix(in oklab,var(--b3,#ddd6f6) 90%,white));
  box-shadow:inset -8px -10px 24px rgba(255,255,255,.5),0 24px 50px -24px color-mix(in oklab,var(--accent) 45%,transparent)}
.orb.b{background:
  radial-gradient(circle at 30% 26%,rgba(255,255,255,.95),rgba(255,255,255,0) 36%),
  linear-gradient(150deg,color-mix(in oklab,var(--b1,#cdebdc) 85%,white),color-mix(in oklab,var(--accent) 35%,var(--b4,#cfe6f5)))}
.ring{border-radius:50%;border:1.5px solid color-mix(in oklab,var(--accent) 45%,transparent);box-shadow:inset 0 0 0 6px color-mix(in oklab,var(--accent) 6%,transparent)}
.capsule{border-radius:999px;background:var(--glass-strong);border:1px solid var(--glass-line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 18px 36px -22px rgba(40,60,55,.45);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--accent)}
.capsule svg{width:18px;height:18px}
.capsule i{display:block;height:6px;border-radius:6px;background:color-mix(in oklab,var(--accent) 30%,transparent);flex:1}
.spark{color:var(--accent)}
.spark svg{width:100%;height:100%;animation:twinkle 3.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:0;animation:tw var(--t,4s) ease-in-out var(--dl,0s) infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.55;transform:scale(1)}}

.logo-wrap{position:relative;display:grid;place-items:center;width:clamp(220px,26vw,320px);aspect-ratio:1;margin:-20px auto -34px}
.logo-wrap .logo{position:relative;z-index:1}
.orbit{position:absolute;inset:0;width:100%;height:100%;overflow:visible;color:var(--accent)}
.orbit .r{fill:none;stroke:currentColor;stroke-width:1;opacity:.28;stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke-dashoffset 2.4s var(--ease-out)}
.orbit .r.d{stroke-dasharray:2 6;opacity:.35;stroke-dashoffset:0;clip-path:circle(0% at 50% 50%);transition:clip-path 2s .4s var(--ease-out)}
.loaded .orbit .r{stroke-dashoffset:0}
.loaded .orbit .r.d{clip-path:circle(75% at 50% 50%)}
.orbit .spin{transform-origin:150px 150px;animation:spin 24s linear infinite}
.orbit .spin.rev{animation-duration:36s;animation-direction:reverse}
.orbit .spin.slow{animation-duration:60s}
.orbit .sat,.orbit .dot{opacity:0;transition:opacity 1s 1.4s}
.loaded .orbit .sat,.loaded .orbit .dot{opacity:1}
.orbit .pulse{fill:none;stroke:var(--accent);stroke-width:1.2;transform-origin:150px 150px;opacity:0;animation:pulse 4.8s var(--ease-out) infinite}
.orbit .pulse:nth-of-type(2){animation-delay:1.6s}.orbit .pulse:nth-of-type(3){animation-delay:3.2s}
@keyframes pulse{0%{transform:scale(.55);opacity:.45}100%{transform:scale(1.35);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit .halo{fill:url(#halo)}
:root[data-theme="dark"] .orbit .halo{opacity:.08}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .orbit .halo{opacity:.08}}

@media (max-width:760px){.hide-sm{display:none}.logo-wrap{margin:-10px auto -24px}}

/* ---------- Tabs ---------- */
.tabs-wrap{display:flex;justify-content:center;margin:0 0 8px;overflow-x:auto;scrollbar-width:none;padding:4px}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{position:relative;display:inline-flex;gap:2px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tab{position:relative;z-index:1;appearance:none;border:0;background:transparent;font:500 14.5px/1 var(--body);color:var(--muted);padding:11px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .35s}
.tab small{font-size:12px;opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
.tab:hover{color:var(--ink)}
.tab.on{color:#fff}
.tab-ind{position:absolute;z-index:0;top:5px;bottom:5px;left:0;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 20px -8px color-mix(in oklab,var(--accent) 70%,transparent);transition:transform .55s var(--ease-out),width .55s var(--ease-out)}

/* ---------- Cards ---------- */
.content{padding-bottom:40px}
.sec{padding:36px 0 8px}
.sec-h{font-family:var(--display);font-weight:500;font-size:clamp(20px,2vw,24px);letter-spacing:-.01em;margin:0 0 16px;display:flex;align-items:baseline;gap:10px}
.sec-h small{font:400 14px var(--body);color:var(--faint)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease-out),transform .9s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.static .reveal{transition:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;min-height:220px;padding:24px;border-radius:24px;text-decoration:none;color:inherit;isolation:isolate;overflow:hidden;
  background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 30px -22px rgba(40,60,55,.4);transition:transform .6s var(--ease-out),box-shadow .6s var(--ease-out),background .4s}
.card::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .45s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),color-mix(in oklab,var(--accent) 16%,transparent),transparent 60%)}
.card:hover{transform:translateY(-5px);background:var(--glass-strong);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 26px 50px -26px color-mix(in oklab,var(--accent) 45%,rgba(20,30,28,.5))}
.card:hover::before{opacity:1}
.anim .reveal.in .card{animation:cardIn .8s var(--ease-out) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.97)}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.ico{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);transition:background .45s,color .45s,transform .7s var(--ease-out)}
.ico svg{width:22px;height:22px}
.card:hover .ico{background:var(--accent);color:#fff;transform:rotate(-8deg) scale(1.05)}
.tag{font:500 13px/1 var(--body);color:var(--tag-ink);background:var(--tag-bg);border:1px solid color-mix(in oklab,var(--accent) 22%,transparent);border-radius:999px;padding:7px 12px;white-space:nowrap}
.card-t{font-family:var(--display);font-weight:500;font-size:clamp(18px,1.6vw,20px);line-height:1.4;margin:0}
.card-d{color:var(--muted);font-size:15px;margin:6px 0 0;line-height:1.6}
.go{margin-top:auto;padding-top:20px;display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:500;color:var(--ink)}
.go b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);transition:background .4s,border-color .4s,color .4s,transform .6s var(--ease-out)}
.go svg{width:16px;height:16px}
.card:hover .go b{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;transform:rotate(45deg)}
.card.nolink .go{display:none}
.empty-note{color:var(--faint);font-size:15px;border:1px dashed var(--line);border-radius:18px;padding:22px;background:var(--glass)}
.no-hit{text-align:center;color:var(--muted);padding:48px 0;font-size:15px}

.foot{margin-top:56px;padding:28px 0 36px}
.foot-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 40px;align-items:center;padding:clamp(22px,3vw,34px);border-radius:26px;
  background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.foot-id b{display:block;font:500 clamp(18px,1.8vw,21px)/1.35 var(--display);margin-bottom:4px}
.foot-id span{display:block;color:var(--muted);font-size:14.5px}
.foot-id small{display:block;color:var(--faint);font-size:13px;margin-bottom:10px}
.contacts{display:flex;flex-wrap:wrap;gap:10px}
.contact{display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:999px;text-decoration:none;color:var(--ink);background:var(--glass-strong);
  border:1px solid var(--glass-line);transition:transform .5s var(--ease-out),box-shadow .5s var(--ease-out)}
.contact:hover{transform:translateY(-3px);box-shadow:0 14px 28px -16px color-mix(in oklab,var(--accent) 60%,transparent)}
.contact .ci{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none}
.contact .ci svg{width:17px;height:17px}
.contact em{display:block;font-style:normal;font-size:12px;color:var(--muted);line-height:1.2}
.contact strong{display:block;font-weight:500;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.foot-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:18px 6px 0;font-size:13px;color:var(--faint)}
@media (max-width:760px){.foot-card{grid-template-columns:1fr}}
.bgp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:6px 0}
.bgp button{appearance:none;border:1px solid var(--line);border-radius:12px;padding:0;cursor:pointer;overflow:hidden;background:var(--surface);text-align:left;font:13px var(--body);color:var(--ink);transition:box-shadow .2s}
.bgp button span{display:block;height:46px}
.bgp button em{display:block;font-style:normal;padding:6px 10px}
.bgp button.on{box-shadow:0 0 0 2px var(--ink)}

/* ---------- Dock ---------- */
.dock{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:4px;padding:5px;
  background:color-mix(in oklab,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;
  box-shadow:0 10px 30px -12px rgba(20,30,28,.25);transition:transform .6s var(--ease-out),opacity .4s}
.dock.away{transform:translateY(140%);opacity:0}
.dbtn{appearance:none;border:0;background:transparent;color:var(--ink);font:500 14px/1 var(--body);padding:10px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .25s}
.dbtn:hover{background:var(--accent-soft)}
.dbtn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.dbtn.primary:hover{filter:brightness(1.08)}
.dbtn svg{width:16px;height:16px}

/* ---------- Editor ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,13,.28);z-index:48;opacity:0;pointer-events:none;transition:opacity .45s}
.editing .scrim{opacity:1;pointer-events:auto}
@media (min-width:1100px){.editing .scrim{opacity:0;pointer-events:none}.editing #app{margin-right:440px}}
#app{transition:margin .6s var(--ease-out)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:50;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(102%);transition:transform .6s var(--ease-out);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.editing .drawer{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-head h2{margin:0;font:500 18px/1.2 var(--display)}
.dr-body{flex:1;overflow:auto;padding:14px 16px 40px;overscroll-behavior:contain}
.dr-foot{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line);background:var(--surface)}
.dr-foot .dbtn{flex:1;justify-content:center;border:1px solid var(--line)}
.dr-foot .dbtn.primary{border-color:transparent}
.dr-note{font-size:12.5px;color:var(--muted);padding:0 16px 10px;margin:0}
.grp{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--bg);overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:500;font-size:15px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .chev{margin-left:auto;transition:transform .35s var(--ease-out);color:var(--faint)}
.grp[open]>summary .chev{transform:rotate(90deg)}
.grp>summary .kind{font-size:11.5px;color:var(--faint);font-weight:400;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.grp>summary .hid{font-size:11.5px;color:var(--accent)}
.grp-in{padding:4px 14px 14px;animation:drop .4s var(--ease-out)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;font:15px/1.5 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;transition:border-color .2s,box-shadow .2s}
.fld textarea{min-height:72px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item{border:1px solid var(--line);border-radius:11px;padding:4px 12px 10px;margin:10px 0;background:var(--surface);animation:pop .45s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.ibtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:6px 9px;font:13px/1.2 var(--body);cursor:pointer;transition:color .2s,border-color .2s}
.ibtn:hover{color:var(--ink);border-color:var(--faint)}
.ibtn.danger:hover{color:#C23A2B;border-color:#C23A2B}
.ibtn:disabled{opacity:.35;cursor:default}
.add{width:100%;border:1px dashed var(--faint);background:transparent;color:var(--ink);border-radius:10px;padding:10px;font:500 14px var(--body);cursor:pointer;margin-top:6px;transition:border-color .2s,background .2s}
.add:hover{border-color:var(--accent);background:var(--accent-soft)}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.icons button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.2s}
.icons button svg{width:18px;height:18px}
.icons button:hover{color:var(--ink)}
.icons button.on{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .3s var(--ease-out)}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.swatches input[type=color]{width:34px;height:34px;padding:0;border:0;background:none;cursor:pointer}
.ph{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ph img{height:40px;width:auto;max-width:140px;object-fit:contain;background:#fff;border-radius:6px;padding:3px}
.newsec{display:flex;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);font-size:14px;
  padding:10px 18px;border-radius:999px;transition:.45s var(--ease-out);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.banner{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:45;display:flex;gap:10px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;font-size:14px;box-shadow:0 10px 30px -14px rgba(0,0,0,.3);max-width:calc(100vw - 24px)}

@media (max-width:640px){
  .tabs-wrap{justify-content:flex-start}
  .card{min-height:0}
  .hero{text-align:left}
  .sub,.finder{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .title .w>span,.fade,.reveal{transform:none!important;opacity:1!important}
  html{scroll-behavior:auto}
  .px>*{opacity:1!important;transform:none!important}
  .orbit .r{stroke-dashoffset:0!important}.orbit .r.d{clip-path:none!important}
  .orbit .sat,.orbit .dot{opacity:1!important}.orbit .pulse{display:none}
}

  const pool=groups.filter(g=>activeTab==='all'||g.id===activeTab).map(g=>({g,items:g.items.filter(matches)}));
  const anyHit=pool.some(x=>x.items.length);
  const total=groups.reduce((n,g)=>n+g.items.length,0);
  const tabs=groups.length>1?`<div class="tabs-wrap"><div class="tabs" role="tablist" aria-label="หมวดระบบ"><span class="tab-ind"></span>
      <button class="tab ${activeTab==='all'?'on':''}" role="tab" aria-selected="${activeTab==='all'}" data-tab="all">ทั้งหมด<small>${total}</small></button>
      ${groups.map(g=>`<button class="tab ${activeTab===g.id?'on':''}" role="tab" aria-selected="${activeTab===g.id}" data-tab="${esc(g.id)}">${esc(g.title||'ไม่มีชื่อ')}<small>${g.items.length}</small></button>`).join('')}
    </div></div>`:'';
  let n=0;
  $('#main').className='content'+(animateNext?' anim':'');
  $('#main').innerHTML=tabs+pool.filter(x=>x.items.length||(!query&&editing)).map(({g,items})=>`
    <section class="sec" id="grp-${esc(g.id)}">

      <div class="reveal">${items.length?`<div class="cards">${items.map(it=>card(it,n++,s)).join('')}</div>`:'<p class="empty-note">หมวดนี้ยังว่างอยู่ เพิ่มระบบได้จากแผงแก้ไข</p>'}</div>

    +(!groups.length&&editing?'<p class="empty-note" style="margin-top:24px">ยังไม่มีหมวดที่แสดง เพิ่มหมวดใหม่ได้จากแผงแก้ไข</p>':'');
  placeIndicator();

  animateNext=false;
}

let revealIO=null, revealed=false;
function setupReveal(){

  els.forEach(e=>revealIO.observe(e));
}

    requestAnimationFrame(()=>{const d=drBody().querySelector(`[data-key="grp-${id}"]`);d?.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});d?.querySelector('input')?.select()})}

function focusLast(){requestAnimationFrame(()=>{const its=drBody().querySelectorAll('details[open] .item');const it=its[its.length-1];it?.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});it?.querySelector('input')?.focus({preventScroll:true})})}
function resize(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/png'))};img.src=r.result};r.readAsDataURL(file)})}
async function download(name,text,type){
  const blob=new Blob([text],{type});
  if(downloadsApi){try{await downloadsApi.save({filename:name,data:blob});return}catch(e){if(e?.code!=='unavailable')return}}
  if(!inRuntime){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return}
  try{await navigator.clipboard.writeText(text);toast('คัดลอกเนื้อหาไปยังคลิปบอร์ดแล้ว')}catch(_){toast('ดาวน์โหลดไม่ได้ในมุมมองนี้')}
}

function buildDocument(d){
  const json=JSON.stringify(d).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="th">\n<head>\n'+HEAD_SRC+'\n</head>\n<body>\n<div id="app"></div>\n<script type="application/json" id="site-data" data-keep>'+json+'<\/script>\n'+MAIN_SRC+'\n</body>\n</html>';
}
let saving=false;
async function save(){
  if(saving)return; if(!dirty()){toast('ไม่มีการเปลี่ยนแปลง');return}
  saving=true;const btn=$('#b-save');btn.textContent='กำลังบันทึก…';
  const done=m=>{saving=false;btn.textContent='บันทึก';if(m)toast(m)};
  if(artifactApi&&!readOnly){
    try{await artifactApi.publish(buildDocument(data));saved=clone(data);store.del(LOCAL_KEY);store.del(DRAFT_KEY);done('บันทึกแล้ว');setEditing(false);return}
    catch(e){const c=e?.code;
      if(c==='conflict'){done('มีเวอร์ชันใหม่กว่าถูกบันทึกไปก่อน กำลังโหลดเวอร์ชันล่าสุด ร่างของคุณยังเก็บไว้');return}
      if(['not_writer','not_granted','not_declared','consent_required'].includes(c))readOnly=true;
      else if(c==='too_large'){done('ข้อมูลใหญ่เกินไป ลองใช้โลโก้ไฟล์เล็กลง');return}
      else if(c==='rate_limited'){done('บันทึกถี่เกินไป รอสักครู่แล้วลองอีกครั้ง');return}
      else{done('บันทึกไม่สำเร็จ ลองอีกครั้ง');return}}
  }
  store.set(LOCAL_KEY,JSON.stringify(data));saved=clone(data);store.del(DRAFT_KEY);
  done('บันทึกในเบราว์เซอร์นี้แล้ว ดาวน์โหลดไฟล์ HTML เพื่ออัปโหลดขึ้นเว็บ');setEditing(false);
}
function checkDraft(){
  const d=store.get(DRAFT_KEY);if(!d)return;if(d===JSON.stringify(saved)){store.del(DRAFT_KEY);return}
  const bar=document.createElement('div');bar.className='banner';
  bar.innerHTML='<span>มีร่างที่ยังไม่ได้บันทึก</span><button class="ibtn" id="dx">ทิ้ง</button><button class="dbtn primary" id="dr" style="padding:8px 14px">กู้คืน</button>';
  document.body.appendChild(bar);
  $('#dx').onclick=()=>{store.del(DRAFT_KEY);bar.remove()};
  $('#dr').onclick=()=>{try{data=normalize(JSON.parse(d))}catch(_){}bar.remove();setEditing(true)};
}

/* ---------- boot ---------- */
render();
(async()=>{
  if(inRuntime){
    const C=window.claude;
    const [art,usr,dl]=await Promise.all([C.use('artifact').catch(()=>null),C.use('user').catch(()=>null),C.use('downloads').catch(()=>null)]);
    artifactApi=art;downloadsApi=dl;
    if(usr){try{canEdit=await usr.canEdit()}catch(_){canEdit=false}}else canEdit=!!art;
  }else{
    // On your own hosting: open the editor by adding #edit to the URL (e.g. index.html#edit)
    canEdit=/(^|[#?&])edit\b/.test(location.hash+location.search);
  }
  $('#b-edit').hidden=!canEdit;
  if(canEdit)checkDraft();
})();
addEventListener('hashchange',()=>{if(!inRuntime&&/edit/.test(location.hash)){canEdit=true;$('#b-edit').hidden=false;setEditing(true)}});
})();
</script>
